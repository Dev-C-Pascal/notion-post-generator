# Продакшен на одному EC2: app (FastAPI) + caddy (HTTPS, потрібен Notion для вебхука).
services:
  app:
    build: .
    image: post-generator:${IMAGE_TAG:-local}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/srv/data
    # тільки loopback: назовні ходимо через Caddy, а smoke-тест у deploy.yml б'є в 127.0.0.1:8000
    ports:
      - "127.0.0.1:8000:8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  caddy_data:
