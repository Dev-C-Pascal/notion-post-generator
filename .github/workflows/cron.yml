name: Scheduled run
# Розклад вимкнено 2026-09-28: щоденний /run без каналу нікому не потрібен (драфти йдуть з кнопок FB/X).
# Лишається ручний запуск (Actions → Run workflow). Повернути розклад: schedule: - cron: "0 7 * * *"
on:
  workflow_dispatch:
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: POST /run
        env:
          RUN_URL: ${{ secrets.RUN_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          curl -fsS -X POST "$RUN_URL/run" -H "x-webhook-secret: $WEBHOOK_SECRET"
