name: Scheduled run
on:
  schedule:
    - cron: "0 7 * * *"   # щодня 07:00 UTC
  workflow_dispatch:
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: POST /run
        env:
          RUN_URL: ${{ secrets.RUN_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          curl -fsS -X POST "$RUN_URL/run" -H "x-webhook-secret: $WEBHOOK_SECRET"
